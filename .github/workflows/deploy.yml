name: CI & Build CyberShield India (PWA + Android APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Test Flask API & ML Models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest test suite
        run: |
          cd backend
          pytest tests/ -v

  build-pwa:
    name: Build React PWA Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build PWA Production Distribution
        run: |
          cd frontend
          npm run build

      - name: Upload PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybershield-pwa-dist
          path: frontend/dist/

  build-android-apk:
    name: Build Android APK
    needs: [build-pwa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload CyberShield Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberShield-India-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
